<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Modelo Gastronômico • Showroom Automatech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&family=Bebas+Neue&family=Oswald:wght@600;700&family=Righteous&family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Montserrat:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Space+Grotesk:wght@600;700&family=Poppins:wght@600;700;800&family=Fredoka:wght@600;700&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Noto+Serif:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Roboto+Slab:wght@700;800&family=Archivo+Black&family=DM+Serif+Display:ital@0;1&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/showroom/gastronomia.css">
</head>
<body>

  <!-- HEADER OFICIAL EM HTML REAL -->
  <header class="topbar">
    <div class="brand">
      <div class="mark" id="brand-mark" aria-hidden="true"></div>
      <div class="brand-text">
        <strong id="topbar-brand"></strong>
        <small id="topbar-tagline"></small>
      </div>
    </div>

    <nav aria-label="Controles">
      <button class="primary checkout" data-modal="pedido" aria-label="Finalizar pedido demonstrativo">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l2 14H3L5 7Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
        <span class="btn-text">Finalizar pedido</span>
      </button>

      <button id="theme" class="theme" aria-label="Alternar tema" aria-pressed="false">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 15A9 9 0 0 1 9 3a9 9 0 1 0 11 12Z"/></svg>
        <span class="theme-label">Escuro</span>
        <i class="switch"></i>
      </button>

      <button class="more" data-modal="info" aria-label="Mais informações">•••</button>
    </nav>
  </header>

  <!-- HERO PRINCIPAL (PRÉVIA DO SITE REAL EM HTML/CSS) -->
  <main class="hero" id="inicio">
    <section class="hero-content">
      <div class="hero-identity">
        <div class="brand">
          <div class="mark mini-mark" id="hero-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <strong id="hero-brand"></strong>
            <small id="hero-niche-pill">LOJA DEMONSTRATIVA</small>
          </div>
        </div>
        <span class="status"><i></i>Recebendo pedidos</span>
      </div>

      <h1 id="hero-title"></h1>
      <p class="subtitle" id="hero-subtitle"></p>

      <div class="metadata">
        <span class="rating"><span class="star">★</span><b>4,5</b> <small>(243)</small></span>
        <span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="meta-bairro">Polo Gastronômico</span>
        </span>
        <span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span id="meta-horario">18h às 02h</span>
        </span>
      </div>

      <div class="actions">
        <button class="primary hero-btn" data-modal="cardapio">
          <span>Ver cardápio</span>
          <span class="arrow">→</span>
        </button>
        <button class="secondary hero-btn" data-modal="info">
          <span class="info-badge">ⓘ</span>
          <span>Informações</span>
        </button>
      </div>

      <footer class="disclaimer">
        <span>Modelo demonstrativo • Imagem ilustrativa.</span>
      </footer>
    </section>

    <!-- FOTOGRAFIA DO PRATO REAL -->
    <div class="hero-photo">
      <div class="photo-card">
        <img id="dish-img" src="" alt="Prato representativo do modelo" fetchpriority="high">
      </div>
      <div class="photo-accent" aria-hidden="true"></div>
    </div>
  </main>

  <!-- MODAL / DIALOG OFICIAL -->
  <dialog id="modal-dialog">
    <div class="dialog-header">
      <h2 id="dialog-title">Informações</h2>
      <button type="button" class="btn-close" aria-label="Fechar" onclick="document.getElementById('modal-dialog').close()">✕</button>
    </div>
    
    <div id="dialog-content"></div>

    <div class="dialog-footer">
      <span>Desenvolvido pela <strong>Automatech</strong></span>
      <button type="button" class="btn-whats-automatech" onclick="window.open('https://wa.me/555199735892', '_blank')">WhatsApp Automatech ›</button>
    </div>
  </dialog>

  <script src="/showroom/catalogo.js"></script>
  <script src="/showroom/gastronomia.js"></script>
</body>
</html>
