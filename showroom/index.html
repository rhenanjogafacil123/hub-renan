    let currentNicheId = 'hamburguerias';
    let currentTemplateId = 'H01';

    function toggleHubSidebar() {
      const sidebar = document.getElementById('hub-sidebar');
      const backdrop = document.getElementById('hub-sidebar-backdrop');
      if (!sidebar || !backdrop) return;
      const isOpen = !sidebar.classList.contains('-translate-x-full');
      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
      }
    }

    function toggleNicheFolder(nicheId) {
      const niche = NICHES_DATA.find(n => n.id === nicheId);
      if (!niche) return;
      niche.open = !niche.open;
      renderNichesList();
    }

    function selectNiche(nicheId) {
      const niche = NICHES_DATA.find(n => n.id === nicheId);
      if (!niche) return;
      currentNicheId = nicheId;
      niche.open = true;

      // Atualizar badge no header superior
      document.getElementById('active-niche-badge').textContent = niche.name;

      // Atualizar barra de pílulas rápidas
      renderQuickPills(niche);

      // Se tiver modelos, selecionar o primeiro
      if (niche.models && niche.models.length > 0) {
        switchTemplate(niche.models[0].id);
      } else {
        renderNichesList();
      }
    }

    function renderNichesList(filterTerm = '') {
      const container = document.getElementById('niches-list');
      if (!container) return;

      const term = filterTerm.toLowerCase().trim();
      const filtered = NICHES_DATA.filter(n => {
        if (!term) return true;
        const matchNiche = n.name.toLowerCase().includes(term);
        const matchModel = n.models.some(m => m.name.toLowerCase().includes(term) || m.id.toLowerCase().includes(term));
        return matchNiche || matchModel;
      });

      container.innerHTML = filtered.map(niche => {
        const isCurrentNiche = niche.id === currentNicheId;
        const isOpen = niche.open || term.length > 0;

        return `
          <div class="rounded-xl border ${isCurrentNiche ? 'border-amber-300 bg-amber-50/40' : 'border-slate-200/70 bg-white'} overflow-hidden transition shadow-2xs">
            
            <!-- Botão da Pasta do Nicho -->
            <button 
              type="button" 
              onclick="toggleNicheFolder('${niche.id}')" 
              class="w-full px-2.5 py-2 flex items-center justify-between text-left hover:bg-slate-50 transition group"
            >
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-sm shrink-0">${niche.icon}</span>
                <span class="text-xs font-bold ${isCurrentNiche ? 'text-amber-950 font-black' : 'text-slate-800'} truncate group-hover:text-amber-800 transition">
                  ${niche.name}
                </span>
              </div>

              <div class="flex items-center gap-1.5 shrink-0 ml-1">
                <span class="text-[9px] font-bold px-1.5 py-0.2 rounded-md ${isCurrentNiche ? 'bg-amber-200 text-amber-900' : 'bg-slate-100 text-slate-500'}">
                  ${niche.models.length}
                </span>
                <svg class="size-3.5 text-slate-400 transition-transform duration-200 ${isOpen ? 'rotate-180 text-slate-700' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </button>

            <!-- Sub-lista de modelos da pasta (quando aberta) -->
            ${isOpen ? `
              <div class="border-t border-slate-100/90 bg-slate-50/60 p-1.5 space-y-1">
                ${niche.models.map(m => {
                  const isActive = m.id === currentTemplateId;
                  return `
                    <button 
                      type="button" 
                      onclick="selectModelFromSidebar('${niche.id}', '${m.id}')" 
                      class="w-full px-2 py-1.5 rounded-lg text-left text-xs flex items-center justify-between transition ${isActive ? 'bg-amber-500 text-slate-950 font-black shadow-xs' : 'text-slate-700 hover:bg-slate-200/70 hover:text-slate-900'}"
                    >
                      <div class="flex items-center gap-1.5 truncate">
                        <span class="text-[10px] font-mono opacity-80">${m.code}</span>
                        <span class="truncate">${m.name.replace(/^[A-Z0-9]+ — /, '')}</span>
                      </div>
                      ${isActive ? '<span class="size-1.5 rounded-full bg-slate-950 shrink-0"></span>' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            ` : ''}

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function renderQuickPills(niche) {
      const container = document.getElementById('models-quick-pills');
      if (!container || !niche || !niche.models) return;

      container.innerHTML = niche.models.map(m => {
        const isActive = m.id === currentTemplateId;
        return `
          <button 
            onclick="switchTemplate('${m.id}')" 
            id="tab-${m.id}" 
            class="tab-btn px-3 py-1.5 text-xs rounded-lg border trans-all flex items-center gap-1.5 whitespace-nowrap ${isActive ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-sm font-black' : 'bg-slate-100 text-slate-700 border-slate-200/80 hover:bg-slate-200 hover:text-slate-900 font-medium'}"
          >
            <span>${m.code}</span>
            <span class="font-bold">${m.name.replace(/^[A-Z0-9]+ — /, '')}</span>
          </button>
        `;
      }).join('');
    }

    function selectModelFromSidebar(nicheId, modelId) {
      const niche = NICHES_DATA.find(n => n.id === nicheId);
      if (niche) {
        currentNicheId = nicheId;
        document.getElementById('active-niche-badge').textContent = niche.name;
        renderQuickPills(niche);
      }
      switchTemplate(modelId);
    }

    function switchTemplate(id) {
      currentTemplateId = id;

      // Buscar modelo nos dados
      let foundModel = null;
      let foundNiche = null;
      for (const n of NICHES_DATA) {
        const m = n.models.find(x => x.id === id);
        if (m) {
          foundModel = m;
          foundNiche = n;
          break;
        }
      }

      if (foundNiche && foundNiche.id !== currentNicheId) {
        currentNicheId = foundNiche.id;
        document.getElementById('active-niche-badge').textContent = foundNiche.name;
        renderQuickPills(foundNiche);
      }

      // Atualizar pílulas rápidas
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400', 'shadow-sm', 'font-black');
        btn.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-200/80', 'font-medium');
      });
      const activeBtn = document.getElementById(`tab-${id}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-200/80', 'font-medium');
        activeBtn.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400', 'shadow-sm', 'font-black');
      }

      // Atualizar lista da barra lateral
      renderNichesList(document.getElementById('niche-search-input')?.value || '');

      // Atualizar ficha técnica
      if (foundModel) {
        document.getElementById('spec-name').textContent = `${foundModel.code} — ${foundModel.name}`;
        document.getElementById('spec-fonts').textContent = foundModel.fonts || 'Plus Jakarta Sans';
      }

      // Atualizar link externo
      const btnOpen = document.getElementById('btn-open-store');
      if (btnOpen) btnOpen.href = `/juca/?hero=${id}`;

      // Disparar postMessage para o iframe
      const iframe = document.getElementById('store-iframe');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'switchHero', template: id }, '*');
      }
    }

    function filterNiches(value) {
      renderNichesList(value);
    }

    function setViewMode(mode) {
      const frame = document.getElementById('simulator-frame');
      const btnDesktop = document.getElementById('btn-view-desktop');
      const btnMobileLg = document.getElementById('btn-view-mobile-lg');
      const btnMobileSm = document.getElementById('btn-view-mobile-sm');

      [btnDesktop, btnMobileLg, btnMobileSm].forEach(b => {
        b.classList.remove('bg-white', 'text-slate-950', 'font-bold', 'shadow-xs', 'border', 'border-slate-200/60');
        b.classList.add('text-slate-600', 'font-medium');
      });

      frame.classList.remove('device-frame-pc', 'device-frame-mobile-lg', 'device-frame-mobile-sm');

      if (mode === 'mobile-sm') {
        frame.classList.add('device-frame-mobile-sm');
        btnMobileSm.classList.add('bg-white', 'text-slate-950', 'font-bold', 'shadow-xs', 'border', 'border-slate-200/60');
        btnMobileSm.classList.remove('text-slate-600', 'font-medium');
      } else if (mode === 'mobile-lg') {
        frame.classList.add('device-frame-mobile-lg');
        btnMobileLg.classList.add('bg-white', 'text-slate-950', 'font-bold', 'shadow-xs', 'border', 'border-slate-200/60');
        btnMobileLg.classList.remove('text-slate-600', 'font-medium');
      } else {
        frame.classList.add('device-frame-pc');
        btnDesktop.classList.add('bg-white', 'text-slate-950', 'font-bold', 'shadow-xs', 'border', 'border-slate-200/60');
        btnDesktop.classList.remove('text-slate-600', 'font-medium');
      }
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const initialNiche = NICHES_DATA.find(n => n.id === 'hamburguerias');
      renderQuickPills(initialNiche);
      renderNichesList();

      const iframe = document.getElementById('store-iframe');
      if (iframe) {
        iframe.addEventListener('load', () => {
          iframe.contentWindow.postMessage({ type: 'switchHero', template: currentTemplateId }, '*');
        });
      }
    });
  </script>
