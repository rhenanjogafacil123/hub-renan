  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            bebas: ['"Bebas Neue"', 'sans-serif'],
            oswald: ['"Oswald"', 'sans-serif'],
            righteous: ['"Righteous"', 'cursive'],
            outfit: ['"Outfit"', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            fraunces: ['"Fraunces"', 'serif'],
          }
        }

    }

  <style>
    /* Alta nitidez e legibilidade no Windows/Mobile */
    body, input, button, select, textarea {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Moldura Desktop PC 16:9 Real (Ocupa toda a tela a partir do topo-esquerdo) */
    .device-frame-pc {
      width: 100% !important;
      height: calc(100vh - 66px) !important;
      border-radius: 12px !important;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(203, 213, 225, 0.8) !important;
      background: #ffffff !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex !important;
      flex-direction: column !important;
    }

    /* Moldura Mobile 2 (480px) */
    .device-frame-mobile-lg {
      width: 480px !important;
      max-width: 95vw !important;
      height: calc(100vh - 84px) !important;
      margin-left: auto !important;
      margin-right: auto !important;
      border-radius: 36px !important;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.25), 0 0 0 10px #1e293b !important;
      background: #ffffff !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex !important;
      flex-direction: column !important;
    }
    
    /* Moldura Mobile 1 (390px) */
    .device-frame-mobile-sm {
      width: 390px !important;
      max-width: 95vw !important;
      height: calc(100vh - 84px) !important;
      margin-left: auto !important;
      margin-right: auto !important;
      border-radius: 40px !important;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.25), 0 0 0 10px #1e293b !important;
      background: #ffffff !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex !important;
      flex-direction: column !important;
    }
    
    .trans-all { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

    /* Custom thin scrollbar nítida */
    .niche-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .niche-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .niche-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .niche-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

    let currentTemplateId = 'H01';
    let currentNicheId = 'hamburguerias';
    let currentViewMode = 'desktop';
    let isDesktopSidebarCollapsed = false;

    function toggleDesktopSidebar() {
      const sidebar = document.getElementById('hub-sidebar');
      const layout = document.getElementById('main-content-layout');
      const icon = document.getElementById('btn-sidebar-icon');
      if (!sidebar || !layout) return;

      isDesktopSidebarCollapsed = !isDesktopSidebarCollapsed;

      if (isDesktopSidebarCollapsed) {
        sidebar.classList.add('-translate-x-full');
        layout.classList.remove('lg:pl-52');
        layout.classList.add('lg:pl-0');
        if (icon) icon.setAttribute('data-lucide', 'panel-left-open');
      } else {
        sidebar.classList.remove('-translate-x-full');
        layout.classList.remove('lg:pl-0');
        layout.classList.add('lg:pl-52');
        if (icon) icon.setAttribute('data-lucide', 'panel-left-close');
      }
      lucide.createIcons();
    }

    function toggleHubSidebar() {
      const sidebar = document.getElementById('hub-sidebar');
      const backdrop = document.getElementById('hub-sidebar-backdrop');
      if (!sidebar || !backdrop) return;
      const isOpen = !sidebar.classList.contains('-translate-x-full');
      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('opacity-0', 'pointer-events-none');
      } else {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('opacity-0', 'pointer-events-none');
      }
    }

    function toggleNicheFolder(nicheId) {
      const niche = NICHES_DATA.find(n => n.id === nicheId);
      if (!niche) return;
      niche.open = !niche.open;
      renderNichesList();
    }

    function renderNichesList(filterTerm = '') {
      const container = document.getElementById('niches-list');
      if (!container) return;

      const term = filterTerm.toLowerCase().trim();
      const filtered = NICHES_DATA.filter(n => {
        if (!term) return true;
        const matchNiche = n.name.toLowerCase().includes(term);
        const matchModel = n.models.some(m => m.name.toLowerCase().includes(term) || m.id.toLowerCase().includes(term));
        return matchNiche || matchModel;
      });

      container.innerHTML = filtered.map(niche => {
        const isCurrentNiche = niche.id === currentNicheId;
        const isOpen = niche.open || term.length > 0;

        return `
          <div class="rounded-xl border ${isCurrentNiche ? 'border-amber-400 bg-amber-50/50 shadow-2xs' : 'border-slate-200 bg-white hover:border-slate-300'} overflow-hidden transition-all">
            
            <!-- Botão da Pasta do Nicho -->
            <button 
              type="button" 
              onclick="toggleNicheFolder('${niche.id}')" 
              class="w-full px-2 py-2 flex items-center justify-between text-left hover:bg-slate-50 transition group"
            >
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="text-xs font-black ${isCurrentNiche ? 'text-slate-950 font-black' : 'text-slate-900'} truncate group-hover:text-amber-800 transition tracking-tight">
                  ${niche.name}
                </span>
              </div>

              <div class="flex items-center gap-1 shrink-0 ml-1">
                <span class="text-[9px] font-black px-1.5 py-0.2 rounded ${isCurrentNiche ? 'bg-amber-200 text-amber-950' : 'bg-slate-100 text-slate-700'}">
                  ${niche.models.length}
                </span>
                <svg class="size-3.5 text-slate-600 transition-transform duration-200 ${isOpen ? 'rotate-180 text-slate-950' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </button>

            <!-- Sub-lista de modelos da pasta (cards limpos compactos) -->
            ${isOpen ? `
              <div class="border-t border-slate-200 bg-slate-50 p-1.5 space-y-1">
                ${niche.models.map(m => {
                  const isActive = m.id === currentTemplateId;
                  return `
                    <button 
                      type="button" 
                      onclick="selectModelFromSidebar('${niche.id}', '${m.id}')" 
                      class="w-full px-2 py-1.5 rounded-lg text-left flex items-center justify-between transition ${isActive ? 'bg-amber-500 border border-amber-600 text-slate-950 font-black shadow-xs' : 'bg-white border border-slate-200 hover:border-amber-400 hover:bg-amber-50/60 text-slate-900 font-extrabold shadow-2xs'}"
                    >
                      <div class="flex items-center gap-1.5 min-w-0">
                        <span class="text-[10px] font-mono font-black px-1 py-0.2 rounded ${isActive ? 'bg-slate-950 text-white' : 'bg-slate-100 text-slate-900'} shrink-0">
                          ${m.code.split(' ')[0]}
                        </span>
                        <span class="text-[11px] ${isActive ? 'font-black text-slate-950' : 'font-extrabold text-slate-900'} truncate">
                          ${m.name.replace(/^[0-9.]+\s*—?\s*/, '')}
                        </span>
                      </div>
                      ${isActive ? '<span class="text-xs font-black text-slate-950 shrink-0 ml-1">✓</span>' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            ` : ''}

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function selectModelFromSidebar(nicheId, modelId) {
      const niche = NICHES_DATA.find(n => n.id === nicheId);
      if (niche) {
        currentNicheId = nicheId;
      }
      switchTemplate(modelId);
    }

    function switchTemplate(id) {
      currentTemplateId = id;

      // Buscar modelo nos dados
      let foundModel = null;
      let foundNiche = null;
      for (const n of NICHES_DATA) {
        const m = n.models.find(x => x.id === id);
        if (m) {
          foundModel = m;
          foundNiche = n;
          break;
        }
      }

      if (foundNiche) {
        currentNicheId = foundNiche.id;
      }

      // Atualizar badge no header superior
      if (foundModel) {
        document.getElementById('active-model-pill').textContent = `${foundModel.code} ${foundModel.name.replace(/^[A-Z0-9]+ — /, '')}`;
      }

      // Atualizar lista da barra lateral
      renderNichesList(document.getElementById('niche-search-input')?.value || '');

      // Atualizar link externo
      const btnOpen = document.getElementById('btn-open-store');
      const isHamburguer = /^H0[1-5]$/.test(id);
      const previewPath = isHamburguer ? "/showroom/hamburguerias.html" : "/juca/index.html";
      if (btnOpen) btnOpen.href = `${previewPath}?hero=${id}`;

      // Identificação da moldura: apenas H01–H05 usam a demonstração isolada.
      const previewAddress = document.getElementById('preview-address');
      if (previewAddress) previewAddress.textContent = isHamburguer
        ? 'Showroom · Hamburguerias · ' + id
        : 'https://juca.automatech.tech';
      // Disparar postMessage para o iframe
      const iframe = document.getElementById('store-iframe');
      if (iframe) iframe.title = isHamburguer
        ? 'Demonstração de Hamburgueria ' + id
        : 'Loja Oficial Pizza do Juca em 16:9 Real';
      if (iframe && iframe.contentWindow) {
        const currentPath = new URL(iframe.src, location.href).pathname;
        if (currentPath !== previewPath) iframe.src = `${previewPath}?hero=${id}`;
        else iframe.contentWindow.postMessage({ type: 'switchHero', template: id, modelData: foundModel, nicheData: foundNiche }, location.origin);
      }
    }

    function filterNiches(value) {
      renderNichesList(value);
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      const frame = document.getElementById('simulator-frame');
      const browserBar = document.getElementById('browser-chrome-bar');
      const btnDesktop = document.getElementById('btn-view-desktop');
      const btnMobileLg = document.getElementById('btn-view-mobile-lg');
      const btnMobileSm = document.getElementById('btn-view-mobile-sm');

      [btnDesktop, btnMobileLg, btnMobileSm].forEach(b => {
        b.classList.remove('bg-white', 'text-slate-950', 'font-black', 'shadow-xs', 'border', 'border-slate-200');
        b.classList.add('text-slate-700', 'font-extrabold');
      });

      frame.classList.remove('device-frame-pc', 'device-frame-mobile-lg', 'device-frame-mobile-sm');

      if (mode === 'mobile-sm') {
        frame.classList.add('device-frame-mobile-sm');
        btnMobileSm.classList.add('bg-white', 'text-slate-950', 'font-black', 'shadow-xs', 'border', 'border-slate-200');
        btnMobileSm.classList.remove('text-slate-700', 'font-extrabold');
        if (browserBar) browserBar.style.display = 'none';
      } else if (mode === 'mobile-lg') {
        frame.classList.add('device-frame-mobile-lg');
        btnMobileLg.classList.add('bg-white', 'text-slate-950', 'font-black', 'shadow-xs', 'border', 'border-slate-200');
        btnMobileLg.classList.remove('text-slate-700', 'font-extrabold');
        if (browserBar) browserBar.style.display = 'none';
      } else {
        frame.classList.add('device-frame-pc');
        btnDesktop.classList.add('bg-white', 'text-slate-950', 'font-black', 'shadow-xs', 'border', 'border-slate-200');
        btnDesktop.classList.remove('text-slate-700', 'font-extrabold');
        if (browserBar) browserBar.style.display = 'flex';
      }
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      renderNichesList();

      const iframe = document.getElementById('store-iframe');
      if (iframe) {
        iframe.addEventListener('load', () => {
          const initNiche = NICHES_DATA.find(n => n.models.some(m => m.id === currentTemplateId)); const initModel = initNiche?.models.find(m => m.id === currentTemplateId); iframe.contentWindow.postMessage({ type: 'switchHero', template: currentTemplateId, modelData: initModel, nicheData: initNiche }, location.origin);
        });
      }
    });
  </script>
